<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Ledgerly: sign in</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif;background:#f4f6f8;color:#16202b}
form{background:#fff;border:1px solid #dde3ea;border-radius:12px;padding:32px;width:380px}h1{margin:0 0 20px;font-size:22px}
label{display:block;font-weight:600;margin:14px 0 6px}input{width:100%;font:inherit;padding:10px 12px;border:1px solid #c5cfda;border-radius:8px}
button{margin-top:22px;width:100%;border:0;border-radius:8px;background:#1f5eff;color:#fff;font:600 15px/1 inherit;padding:13px;cursor:pointer}
</style></head><body>
<form method="post" action="/login"><h1>Sign in to Ledgerly</h1>
<label for="e">Email</label><input id="e" name="email" type="email" placeholder="you@company.com">
<label for="p">Password</label><input id="p" name="password" type="password">
<button>Sign in</button></form>
</body></html>
